base_model: "runwayml/stable-diffusion-v1-5"
training_data_dir: "../data/character_curated_final/images"
metadata_path: "../data/character_curated_final/metadata/metadata.jsonl"
resolution: 512
train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1e-4
num_train_epochs: 1
max_train_steps: 250
lr_scheduler: "constant"
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
output_dir: "../data/lora_output/first_experiment"
checkpoint_steps: 100
validation_prompt: "pixel art fantasy warrior character, clean full body, game sprite"
validation_epochs: 1
mixed_precision: "fp16"
use_8bit_adam: false
